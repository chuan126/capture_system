clearance_engine_node:
  ros__parameters:
    input_topic: /capture/lidar/points_compensated_enu
    output_topic: /capture/clearance/result
    expected_frame_id: lidar_local_enu

    filter.min_range_m: 0.20

    # 风机离地通常约5 m。保留1至10 m的上方区域，并扩大水平视场，
    # 覆盖当前车道和相邻车道。East、North无需严格对应地理方向，Up必须准确。
    roi.min_up_height_m: 1.00
    roi.max_up_height_m: 10.0
    roi.east_half_angle_deg: 60.0
    roi.north_half_angle_deg: 60.0

    # 对顶部近水平面和风机底层平面进行单帧多平面提取。
    ransac.max_normal_angle_deg: 20.0
    ransac.distance_threshold_m: 0.04

    # RANSAC在4 cm体素点云上搜索，最终区域拟合和最低高度使用原始分辨率点云。
    ransac.voxel_size_m: 0.04
    ransac.max_iterations: 200
    ransac.probability: 0.99
    ransac.max_candidate_planes: 4

    # 允许顶面移除后继续搜索点数较少的风机底层平面。
    ransac.min_remaining_points: 100
    ransac.min_inliers_absolute: 60
    ransac.min_inlier_ratio: 0.0003

    # 3 cm网格兼顾小平面面积门限和高速点云的连通性。
    # 最低双向跨度约12 cm，最低占用面积约108 cm²。
    region.grid_size_m: 0.030
    region.min_span_cells: 4
    region.min_occupied_cells: 12
    region.max_residual_p95_m: 0.05

    # 启用局部曲面分支；关闭后节点完全退回原有平面检测。
    surface.enabled: true
    # 曲面ROI体素边长，单位m；只影响法向估计和Region Growing。
    surface.voxel_size_m: 0.05
    # 单点法向量估计使用的K近邻数量。
    surface.normal_k_neighbors: 20
    # Region Growing为每个点检查的近邻数量。
    surface.region_neighbor_number: 20
    # 相邻法向最大夹角，单位deg。
    surface.smoothness_threshold_deg: 10.0
    # Region Growing使用的PCL点曲率上限。
    surface.curvature_threshold: 0.10
    # 曲面Cluster最少降采样点数。
    surface.min_cluster_points: 80
    # Cluster在两个水平轴上都必须达到的最小跨度，单位m。
    surface.min_span_m: 0.30
    # 曲面实际覆盖区域的水平占用网格边长，单位m。
    surface.grid_size_m: 0.05
    # 曲面Cluster最少水平占用网格数。
    surface.min_occupied_cells: 20
    # 二次曲面拟合绝对残差P95上限，单位m。
    surface.max_residual_p95_m: 0.10
    # Cluster法向估计曲率P95上限，用于拒绝粗糙噪声。
    surface.max_curvature: 0.10
    # 平均法向必须满足normal_z<=-该值；法向朝传感器定向，负值表示顶部朝下。
    surface.min_downward_normal_z: 0.05
    # Region Growing最大输入点数；9999确保复杂分割输入少于10000点。
    surface.max_input_points: 9999
    # 进入平面/曲面统一最低高度选择的置信度下限，候选必须严格大于该值。
    surface.min_confidence: 0.55
    # 平面与曲面高度差不超过该值时优先保留平面，单位m。
    surface.plane_preference_tolerance_m: 0.02
    # 曲面分支的最高运行频率，单位Hz；平面无效时同样限频，避免故障期间放大CPU压力。
    surface.update_rate_hz: 5.0
