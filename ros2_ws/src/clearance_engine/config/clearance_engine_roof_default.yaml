clearance_engine_node:
  ros__parameters:
    input_topic: /capture/lidar/points_raw
    output_topic: /capture/clearance/result
    diagnostics_topic: /capture/clearance/raw_diagnostics
    # 原始frame_id由部署现场核实；空值只要求消息frame_id非空，不写死厂商device前缀。
    expected_frame_id: ""

    # 单位均为m。圆柱ROI按项目安装定义围绕雷达+X高度轴，仍需现场标定复核。
    raw_cluster.min_detection_x_m: 0.2
    raw_cluster.max_detection_x_m: 10.0
    raw_cluster.detection_radius_m: 1.0
    raw_cluster.support_height_band_m: 0.05
    raw_cluster.min_support_points: 10
    raw_cluster.spatial_grid_size_m: 0.10
    raw_cluster.min_occupied_cells: 3
    raw_cluster.min_spatial_span_m: 0.10
