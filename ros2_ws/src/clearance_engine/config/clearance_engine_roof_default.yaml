clearance_engine_node:
  ros__parameters:
    input_topic: /capture/lidar/points_compensated_enu
    output_topic: /capture/clearance/result
    expected_frame_id: lidar_local_enu

    filter.min_range_m: 0.20

    roi.min_up_height_m: 0.20
    roi.max_up_height_m: 15.0
    roi.east_half_angle_deg: 55.0
    roi.north_half_angle_deg: 35.0

    ransac.max_normal_angle_deg: 15.0
    ransac.distance_threshold_m: 0.04
    ransac.max_iterations: 500
    ransac.probability: 0.99
    ransac.max_candidate_planes: 8
    ransac.min_remaining_points: 500
    ransac.min_inliers_absolute: 300
    ransac.min_inlier_ratio: 0.005

    # 10×10格偶发切掉真实顶面，8×8格会接纳小碎片；实测折中为9×9格。
    region.grid_size_m: 0.10
    region.min_span_cells: 9
    region.min_occupied_cells: 81
    region.max_residual_p95_m: 0.05

    # 启用局部曲面分支；关闭后节点完全退回原有平面检测。
    surface.enabled: true
    # 安全模式固定只接纳下凹曲面；false时曲面分支拒绝运行，避免侧壁进入融合。
    surface.detect_lower_arch_only: true
    # 曲面ROI体素边长，单位m；只影响法向估计和Region Growing。
    surface.voxel_size_m: 0.05
    # 单点法向量估计使用的K近邻数量。
    surface.normal_k_neighbors: 20
    # Region Growing为每个点检查的近邻数量。
    surface.region_neighbor_number: 20
    # 相邻法向最大夹角，单位deg。
    surface.smoothness_threshold_deg: 10.0
    # Region Growing使用的PCL点曲率上限。
    surface.curvature_threshold: 0.10
    # 曲面Cluster最少降采样点数。
    surface.min_cluster_points: 80
    # Cluster在两个水平轴上都必须达到的最小跨度，单位m。
    surface.min_span_m: 0.30
    # 曲面实际覆盖区域的水平占用网格边长，单位m。
    surface.grid_size_m: 0.05
    # 曲面Cluster最少水平占用网格数。
    surface.min_occupied_cells: 20
    # 二次曲面拟合绝对残差P95上限，单位m。
    surface.max_residual_p95_m: 0.10
    # Cluster法向估计曲率P95上限，用于拒绝粗糙噪声。
    surface.max_curvature: 0.10
    # 顶部法向相对朝下方向的最大倾角，单位deg。
    surface.max_tilt_deg: 50.0
    # Cluster中满足顶部朝下法向约束的最低点数比例。
    surface.min_downward_normal_ratio: 0.80
    # 二次曲面Hessian最大特征值下限，单位1/m；用于确认下凹曲率。
    surface.min_positive_curvature: 0.03
    # 下凹曲面允许的最小Hessian特征值负偏差，单位1/m。
    surface.max_negative_curvature: 0.02
    # 两个Hessian特征值均不超过该绝对值时交回平面分支，单位1/m。
    surface.near_plane_curvature_threshold: 0.01
    # 同一水平网格内允许的最大垂向跨度，单位m。
    surface.max_cell_vertical_span_m: 0.20
    # 垂向跨度超限网格占比上限，用于拒绝侧壁和竖直结构。
    surface.max_bad_vertical_cell_ratio: 0.15
    # 拟合最低点到Cluster占用区域边界的最小距离，单位m。
    surface.min_minimum_boundary_distance_m: 0.10
    # 拟合最低点到角度ROI边界的最小水平余量，单位m。
    surface.min_roi_boundary_distance_m: 0.10
    # Region Growing最大输入点数；9999确保复杂分割输入少于10000点。
    surface.max_input_points: 9999
    # 进入平面/曲面统一最低高度选择的置信度下限，候选必须严格大于该值。
    surface.min_confidence: 0.55
    # 平面与下凹曲面最低高度差超过该值时报警，但仍严格输出最低可信值，单位m。
    surface.plane_surface_conflict_threshold_m: 0.50
