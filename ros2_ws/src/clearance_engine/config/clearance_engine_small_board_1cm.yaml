clearance_engine_node:
  ros__parameters:
    input_topic: /capture/lidar/points_compensated_enu
    output_topic: /capture/clearance/result
    expected_frame_id: lidar_local_enu

    filter.min_range_m: 0.20

    roi.min_up_height_m: 0.20
    roi.max_up_height_m: 15.0
    roi.east_half_angle_deg: 55.0
    roi.north_half_angle_deg: 35.0

    ransac.max_normal_angle_deg: 15.0
    ransac.distance_threshold_m: 0.04
    ransac.max_iterations: 500
    ransac.probability: 0.99
    ransac.max_candidate_planes: 12
    ransac.min_remaining_points: 100
    ransac.min_inliers_absolute: 30
    ransac.min_inlier_ratio: 0.0003

    # 1 cm网格实验配置。点间距超过约1.4 cm时，连通区域可能破碎。
    # 最低跨度约5 cm，最低占用面积约15 cm²。
    region.grid_size_m: 0.020
    region.min_span_cells: 5
    region.min_occupied_cells: 15
    region.max_residual_p95_m: 0.05
