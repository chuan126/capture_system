enu_cloud_transform_node:
  ros__parameters:
    input_cloud_topic: /capture/lidar/points_raw
    odometry_topic: /capture/odometry/high_rate
    output_cloud_topic: /capture/lidar/points_compensated_enu
    output_frame_id: lidar_local_enu

    pose_cache_duration_s: 2.0

    # 高频里程计实测约401 Hz。15 ms约对应6个采样周期。
    # 超过该间隔不再强行插值，避免高角加速度下产生较大姿态误差。
    max_interpolation_gap_s: 0.015

    # 使用p_n(t_i)-p_n(t_0)补偿约94 ms滚动扫描期间的车辆平移。
    # 这里只使用同一帧内的相对位移，不使用累计位置作为最终测距结果。
    use_odometry_translation: true

    # 帧起始位姿无法插值时，本帧退化为仅旋转补偿，避免直接清空整帧。
    fallback_to_rotation_only: true

    # 有限且非零的雷达点中，至少75%的点需要获得有效姿态。
    # 覆盖不足的点保留原始排列并写为NaN。
    minimum_valid_pose_ratio: 0.75

    # 60 km/h时94 ms内位移约1.57 m。2.5 m门限保留加速度和时间误差余量，
    # 同时拒绝单帧内明显的位置跳变。
    max_translation_per_scan_m: 2.5

    # 允许点云尾部最多15 ms暂时缺少里程计覆盖。缺少姿态的尾部点写为NaN，
    # 不再持续等待到队列溢出。
    allowed_partial_tail_s: 0.015

    # 设备时间偏移标定接口。默认不修正，单位为秒。
    odometry_time_offset_s: 0.0
    cloud_time_offset_s: 0.0

    # 点云与里程计回调独立处理，等待队列增加到5帧。
    pending_cloud_limit: 5

    # AIO-3588JQ实机A/B/C表明10 ms已获得绝大多数空轮询CPU收益；允许范围[1, 100] ms。
    # 本参数仅在节点启动时读取，修改后需要重启节点或capture-system.service。
    processing_poll_interval_ms: 10

    # 复用系统现有原始诊断入口；ENU明细直接从该Topic读取。
    diagnostics_topic: /diagnostics

    # 姿态覆盖率达到75%时，转换器本身会发布含NaN的部分点云。
    # 低于75%的帧默认丢弃，不把稀疏点云送入净空检测。
    publish_partial_cloud: false

    # 队列溢出或整帧失败时默认不主动发布width=0的空点云，
    # 避免网页和RViz被瞬时清空。日志仍会记录失败原因。
    publish_empty_on_failure: false
