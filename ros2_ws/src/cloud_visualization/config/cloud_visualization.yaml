cloud_visualization_node:
  ros__parameters:
    # 首版只允许关闭预览，不影响雷达、核心计算或记录任务。
    enabled: true

    # 与净空算法共用经过姿态补偿的局部东北天点云，XYZ分别表示东、北、天。
    input_topic: /capture/lidar/points_compensated_enu

    # 拒绝误接原始雷达坐标，防止网页把未经转换的XYZ错误标成东北天。
    expected_frame_id: lidar_local_enu

    # 输出是裁减RGB并限制点数后的轻量XYZ点云Topic。
    output_topic: /capture/visualization/cloud_preview

    # 浏览器预览以5 Hz刷新，中间输入帧由最新帧覆盖。
    publish_rate_hz: 5.0

    # PCV1负载最多允许10,000点，对应每帧最多120,000字节XYZ数据。
    max_points: 10000
